[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lsd-tree-editor"
version = "0.1.0"
description = "A behaviour-tree editor for the lsd-docker server's bots"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Fran6nd"}]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Fran6nd/lsd-docker"

[project.scripts]
lsd-tree-editor = "lsd_tree_editor.app:main"

[tool.setuptools]
packages = ["lsd_tree_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
