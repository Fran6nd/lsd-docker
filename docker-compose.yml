# LSD server (lsd-dev.fran6nd.online). Multi-instance: this one file is
# reused for every instance via `docker compose -p lsd-<name>
# --env-file instances/<name>.env` (see lsdctl). Each instance mounts
# the one shared config.lua and owns a private rw volume; ports differ.
#
# The defaults below keep a bare `docker compose up` working as a single
# instance on 32887, so nothing breaks outside lsdctl.
services:
  lsd:
    build:
      context: .
      args:
        # The commit the server reports for /version. See the Dockerfile:
        # lsd/.git is kept out of the build context on purpose, so the value
        # cannot be read during the build and is passed in instead. lsdctl and
        # update.sh set it from the submodule's HEAD; a bare `docker compose
        # build` leaves it "unknown".
        LSD_COMMIT: ${LSD_COMMIT:-unknown}
    image: lsd
    restart: unless-stopped
    init: true
    environment:
      LSD_PORT: ${LSD_PORT:-32887}
      # the instance config is always mounted at /lsd/config.lua below,
      # so the server always loads it under this fixed in-container path
      LSD_CONFIG: config.lua
      # overlay the in-development scripts.dev/ layer on top of the
      # released scripts.local/ one (0 to run released scripts only)
      LSD_SCRIPTS_DEV: ${LSD_SCRIPTS_DEV:-1}
      # Which file in the mounted instances/ directory is this server's
      # settings. Declared HERE and not only in the .env, because an
      # .env only feeds interpolation in this file -- a variable reaches
      # the container solely by being listed in this block, and without
      # that lib_settings finds no file and every setting silently
      # falls back to its module default.
      LSD_SETTINGS_FILE: ${LSD_SETTINGS_FILE:-}
    ports:
      - "${LSD_PORT:-32887}:${LSD_PORT:-32887}/udp"
    volumes:
      # per-instance config. Maps are per-instance too: lsdctl points
      # LSD_MAPS_DIR at instances/<name>.map/, and ./maps is only the
      # fallback for an instance created before maps were split.
      - ${LSD_CONFIG_FILE:-./config.lua}:/lsd/config.lua:ro
      # The settings directory, read only: the settings file is input.
      #
      # The DIRECTORY and not the file, which matters more than it looks.
      # A single-file bind mount is bound to that file's inode, and sed,
      # vim and most editors save by writing a temp file and renaming it
      # over the original -- a new inode. The container would go on
      # reading the old one for ever, so an edit would never be seen and
      # `settings reload` could never work. Mounting the directory
      # follows the rename.
      #
      # lib_settings finds this instance's file by name inside it,
      # from LSD_SETTINGS_FILE; nothing is written or linked.
      - ./instances:/lsd/instances:ro
      # the map dir is writable: world_editor persists component layouts
      # to <map>.editor.json next to the .vxl it belongs to. Whatever the
      # host path, the container always sees it as /lsd/maps.
      - ${LSD_MAPS_DIR:-./maps}:/lsd/maps
      # scripts come in two layers, released then in-development; the
      # entrypoint overlays them in that order, so a dev file shadows a
      # released one of the same name (and both shadow upstream's)
      - ${LSD_SCRIPTS_DIR:-./scripts.local}:/lsd/scripts.local:ro
      - ${LSD_DEV_SCRIPTS_DIR:-./scripts.dev}:/lsd/scripts.dev:ro
      - lsd-rw:/lsd/rw

volumes:
  lsd-rw:
    # per-instance name so bans/auth databases stay isolated and survive
    # project moves/renames; defaults to the legacy single-instance name
    name: ${LSD_RW_VOLUME:-lsd-rw}
