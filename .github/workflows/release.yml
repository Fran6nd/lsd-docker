# Publishes the image when dev/release.sh pushes a version tag: each
# architecture is built and smoke-tested on its own runner, pushed by
# digest, and the two are joined under the version tag and :latest.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Not `submodules:` -- checkout fetches them shallow, and upstream's
      # server speaks dumb HTTP, which cannot serve a shallow fetch.
      - name: Submodules
        run: git submodule update --init --recursive

      - name: Version
        id: v
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "$v" = "$(cat VERSION)" ] || { echo "tag $v but VERSION says $(cat VERSION)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "lsd=$(git -C lsd rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - run: sudo apt-get update && sudo apt-get install -y luajit && dev/test.sh

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke-test the exact build that is about to be published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: lsd-docker:smoke
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            LSD_COMMIT=${{ steps.v.outputs.lsd }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: SKIP_BUILD=1 dev/smoke.sh

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            LSD_COMMIT=${{ steps.v.outputs.lsd }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          outputs: type=image,name=${{ steps.v.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures
        working-directory: digests
        run: |
          docker buildx imagetools create \
            -t "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" \
            -t "${{ steps.v.outputs.image }}:latest" \
            $(printf '${{ steps.v.outputs.image }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "lsd-docker ${{ steps.v.outputs.version }}" \
            --notes "Image: \`${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}\` (linux/amd64, linux/arm64)"
