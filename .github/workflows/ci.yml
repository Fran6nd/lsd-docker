name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    name: Lua tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not `submodules:` -- checkout fetches them shallow, and upstream's
      # server speaks dumb HTTP, which cannot serve a shallow fetch.
      - name: Submodules
        run: git submodule update --init --recursive
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: dev/test.sh

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -s sh image/entrypoint.sh image/ctl/lsdctl.sh \
            image/ctl/selfupdate.sh install.sh dev/*.sh githooks/commit-msg
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  image:
    name: Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Not `submodules:` -- checkout fetches them shallow, and upstream's
      # server speaks dumb HTTP, which cannot serve a shallow fetch.
      - name: Submodules
        run: git submodule update --init --recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: lsd-docker:smoke
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test
        run: SKIP_BUILD=1 dev/smoke.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.arch }}
          path: smoke.log
